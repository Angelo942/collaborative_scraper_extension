<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PageSender Settings</title>

  <style>
    :root {
      --bg: #f5f7fb;
      --card-bg: #ffffff;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      padding: 32px;
      min-width: 360px;
    }

    .container {
      max-width: 420px;
      margin: 0 auto;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.06);
      border: 1px solid var(--border);
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .description {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 14px;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
    }

    /* Toggle switch */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #d1d5db;
      border-radius: 999px;
      transition: 0.2s;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: 0.2s;
    }

    input:checked + .slider {
      background-color: var(--primary);
    }

    input:checked + .slider:before {
      transform: translateX(20px);
    }

    .mode-title {
      font-size: 14px;
      font-weight: 600;
    }

    .mode-desc {
      font-size: 12px;
      color: var(--muted);
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border-radius: 10px;
      border: none;
      background: var(--primary);
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: var(--primary-hover);
    }

    #status {
      margin-top: 12px;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }

    .site-box {
      display: flex;
      align-items: center;
      justify-content: flex-start; /* text on left, button on right */
      gap: 8px;                    /* space between text and × */
      background: #f3f4f6;
      padding: 4px 10px;           /* thinner vertical padding */
      border-radius: 10px;
      font-size: 13px;
      border: 1px solid #d1d5db;
      box-shadow: 0 1px 1px rgba(0,0,0,0.05);
      width: 100%;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* nicer, clean font */
      overflow-wrap: anywhere;      /* wrap long URLs */
    }

    .site-box span {
      flex: 1 1 auto;              /* fill remaining space */
      word-break: break-word;       /* wrap long words */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 13px;
      color: #111827;               /* dark gray for text */
    }

    .site-box button {
      background: transparent;
      border: none;
      color: #ef4444;
      font-weight: bold;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      padding: 0 4px;              /* small padding to reduce width */
      width: auto;                  /* shrink to content */
    }

    .site-box button:hover {
      color: #b91c1c;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>PageSender Settings</h1>

    <div class="card">
      <div class="field">
        <label for="server-ip">Server IP</label>
        <input type="text" id="server-ip" placeholder="127.0.0.1" />
        <div class="description">
          IP address or hostname of the receiving server.
        </div>
      </div>

      <div class="field">
        <label for="server-port">Server Port</label>
        <input type="number" id="server-port" placeholder="5000" />
        <div class="description">
          Port used for sending and receiving data.
        </div>
      </div>

      <div class="field">
        <div class="toggle-row">
          <div>
            <div class="mode-title">Interactive Navigation Mode</div>
            <div class="mode-desc">
              Allow the server to suggest or request the next page to visit.
            </div>
          </div>

          <label class="toggle">
            <input type="checkbox" id="interactive-mode" />
            <span class="slider"></span>
          </label>
        </div>
      </div>
      <!-- Allowed Sites Section -->
      <div class="field">
        <label>Allowed Sites</label>
        <div class="description">
          The extension will only run on these sites.
        </div>

        <div style="margin-top:8px; display:flex; flex-direction: column; gap:6px;">
          <input
            type="text"
            id="site-input"
            placeholder="https://example.com"
            style="width: 100%; padding: 8px 10px; border-radius:8px; border:1px solid #ddd;"
          />
          <button id="add-site-btn" style="width: 120px; align-self:flex-start; padding:8px 12px; border-radius:8px; background:#4f46e5; color:white; border:none; cursor:pointer;">
            Add Site
          </button>
        </div>

        <!-- List of allowed sites rendered as full-width pills -->
        <div id="site-list" style="margin-top:12px; display:flex; flex-direction: column; gap:8px;"></div>
      </div>

        <!-- List of allowed sites rendered as boxes -->
        <div id="site-list" style="margin-top:12px; display:flex; flex-wrap: wrap; gap:8px;"></div>
      </div>
      <button id="save-btn">Save Settings</button>
      <div id="status"></div>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
