<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PageSender Settings</title>

  <style>
    :root {
      --bg: #f5f7fb;
      --card-bg: #ffffff;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      padding: 32px;
      min-width: 360px;
    }

    .container {
      max-width: 420px;
      margin: 0 auto;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.06);
      border: 1px solid var(--border);
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .description {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 14px;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
    }

    /* Toggle switch */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #d1d5db;
      border-radius: 999px;
      transition: 0.2s;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: 0.2s;
    }

    input:checked + .slider {
      background-color: var(--primary);
    }

    input:checked + .slider:before {
      transform: translateX(20px);
    }

    .mode-title {
      font-size: 14px;
      font-weight: 600;
    }

    .mode-desc {
      font-size: 12px;
      color: var(--muted);
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border-radius: 10px;
      border: none;
      background: var(--primary);
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: var(--primary-hover);
    }

    #status {
      margin-top: 12px;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>PageSender Settings</h1>

    <div class="card">
      <div class="field">
        <label for="server-ip">Server IP</label>
        <input type="text" id="server-ip" placeholder="127.0.0.1" />
        <div class="description">
          IP address or hostname of the receiving server.
        </div>
      </div>

      <div class="field">
        <label for="server-port">Server Port</label>
        <input type="number" id="server-port" placeholder="5000" />
        <div class="description">
          Port used for sending and receiving data.
        </div>
      </div>

      <div class="field">
        <div class="toggle-row">
          <div>
            <div class="mode-title">Interactive Navigation Mode</div>
            <div class="mode-desc">
              Allow the server to suggest or request the next page to visit.
            </div>
          </div>

          <label class="toggle">
            <input type="checkbox" id="interactive-mode" />
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <button id="save-btn">Save Settings</button>
      <div id="status"></div>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
